[package]
name = "baccheck-cli"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[[bin]]
name = "baccheck"
path = "src/main.rs"

[dependencies]
baccheck-core = { path = "../baccheck-core" }
clap = { version = "4", features = ["derive"] }
directories = "6.0.0"

[dev-dependencies]
bacnet-rs = { version = "=0.3.1", default-features = false, features = ["std"] }
pcap-file = "2.0.0"
tempfile = "3"
